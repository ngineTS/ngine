<h2 class="mb-4 fw-bold">Installation</h2>
<p>Ngine combines an Angular frontend, a NestJS backend, and PostgreSQL to power your application.</p>
<figure class="architecture" aria-label="Ngine application architecture">
    <ol class="architecture__flow">
        <li class="architecture__node">
            <span class="architecture__title">Frontend</span>
            <span class="architecture__subtitle">(Angular)</span>
        </li>
        <li class="architecture__node">
            <span class="architecture__title">Backend</span>
            <span class="architecture__subtitle">(NestJS)</span>
        </li>
        <li class="architecture__node">
            <span class="architecture__title">Database</span>
            <span class="architecture__subtitle">(PostgreSQL or another supported database)</span>
        </li>
    </ol>
</figure>
<h4 class="mt-5 mb-3">Installation Options</h4>
<div class="row gap-3 m-0">
    <div class="col installation-option"
        (click)="navigateTo('docker-compose')"
    >
        <i class="bi bi-boxes installation-option__icon" aria-hidden="true"></i>
        <h5 class="installation-option__title">Docker Compose</h5>
        <p class="installation-option__description">A containerized installation option for easy deployment.</p>
    </div>
    <div class="col installation-option"
        (click)="navigateTo('local-development')"
    >
        <i class="bi bi-laptop installation-option__icon" aria-hidden="true"></i>
        <h5 class="installation-option__title">Local Development</h5>
        <p class="installation-option__description">A local installation option for development and testing.</p>
    </div>

</div>
