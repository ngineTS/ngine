@if (_items.length > 0) {
    <div class="row">
        <div class="col-md-6 p-4">
            <img width="100%" height="100%" [src]="imageUrl | async"/>
        </div>
        <div class="col-md-6 mt-md-4 p-4">
            <h2>{{ _items[0].title }}</h2>
            <p class="mt-3">
                {{ _items[0].description }}
            </p>
        </div>
    </div>
}
@else {
    <div class="row">
        <div class="col-md-12 p-4">
            <h2>No feature description found</h2>
        </div>
        @if (_canEdit) {
            <button (click)="onAddFeature()">Add a feature</button>
        }
    </div>
}
