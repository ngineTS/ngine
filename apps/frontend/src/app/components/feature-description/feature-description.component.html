@if (_items.length > 0) {
    <div class="row">
        <div class="col-md-6 p-4">
            <video width="100%" height="100%" controls autoplay [src]="videoUrl | async">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="col-md-6 mt-md-4 p-4">
            <h2>{{ _items[0].title }}</h2>
            <p class="mt-3">
                {{ _items[0].description }}
            </p>
        </div>
    </div>
}
